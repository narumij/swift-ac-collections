name: Loop Layout Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Record experiment environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loop-layout-results"
          {
            git rev-parse HEAD
            uname -a
            lscpu
            cc --version
            ld --version
            python3 --version
          } > "$RUNNER_TEMP/loop-layout-results/workflow-environment.txt"

      - name: Build, verify and measure the isolated probe
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 bash Benchmarks/Probes/LoopLayout/run.sh "$RUNNER_TEMP/loop-layout-results" \
            2>&1 | tee "$RUNNER_TEMP/loop-layout-results/console.log"

      - name: Upload probe evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: loop-layout-results
          path: ${{ runner.temp }}/loop-layout-results
          if-no-files-found: warn
