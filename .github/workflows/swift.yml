name: Swift

on:
  push:
    branches:
      - main
      - compatible/AtCoder/2025
      - "release/**"
  pull_request:
    branches:
      - main
      - compatible/AtCoder/2025

jobs:
  documentation:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest

      - name: Build documentation
        run: >-
          swift package -c release --allow-writing-to-directory .build/documentation
          generate-documentation
          --target RedBlackTreeCollections
          --output-path .build/documentation
          --transform-for-static-hosting
          --hosting-base-path swift-ac-collections
          --warnings-as-errors

      - name: Archive documentation
        run: >-
          tar -czf .build/RedBlackTreeCollections-documentation.tar.gz
          -C .build/documentation .

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: RedBlackTreeCollections-documentation
          path: .build/RedBlackTreeCollections-documentation.tar.gz
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/documentation

  deploy-documentation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  debug:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest

      - name: Run tests
        run: >-
          swift test -c debug
          --traits SKIP_DEBUG_LIFETIME_BALANCE_CHECKS,ENABLE_DEATH_TESTS

  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest

      - name: Run tests
        run: swift test -c release --traits ENABLE_DEATH_TESTS

  performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Checkout HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest

      # 配置差の影響（JCC erratumなど）はCPUに依存するため、runごとのCPUを結果と一緒に残す
      - name: Record runner CPU
        run: |
          mkdir -p head/benchmark-results
          lscpu | tee head/benchmark-results/cpu.txt

      - name: Run current benchmarks
        working-directory: head/Benchmarks
        run: |
          mkdir -p ../benchmark-results

          swift run -c release benchmark library run \
            --library ./Libraries/CI.json \
            ../benchmark-results/current.json \
            --max-size 64k \
            --cycles 1 \
            --mode replace-all

          # end-to-end は size <= 10 を要求するため、小 size 用 library を同じ結果へ追記する
          swift run -c release benchmark library run \
            --library ./Libraries/CI-Small.json \
            ../benchmark-results/current.json \
            --max-size 10 \
            --cycles 1 \
            --mode append

      - name: Run baseline benchmarks
        working-directory: base/Benchmarks
        run: |
          mkdir -p ../benchmark-results

          # CI.json は PR 側の定義を両方の測定に使用する
          cp ../../head/Benchmarks/Libraries/CI.json ./Libraries/CI.json
          cp ../../head/Benchmarks/Libraries/CI-Small.json ./Libraries/CI-Small.json

          swift run -c release benchmark library run \
            --library ./Libraries/CI.json \
            ../benchmark-results/base.json \
            --max-size 64k \
            --cycles 1 \
            --mode replace-all

          # end-to-end は size <= 10 を要求するため、小 size 用 library を同じ結果へ追記する
          swift run -c release benchmark library run \
            --library ./Libraries/CI-Small.json \
            ../benchmark-results/base.json \
            --max-size 10 \
            --cycles 1 \
            --mode append

      - name: Check performance regression
        working-directory: head/Benchmarks
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="$(
            swift run -c release benchmark results compare \
              ../../base/benchmark-results/base.json \
              ../benchmark-results/current.json
          )"

          printf '%s\n' "$OUTPUT" \
            | tee ../benchmark-results/comparison.txt

          printf '%s\n' "$OUTPUT" |
          awk '
            /^[[:space:]]*[0-9]/ {
              regression = $4
              sub(/\(.*/, "", regression)

              # 30% slower:
              # current / baseline >= 1.30
              # => baseline / current <= 1 / 1.30
              if ((regression + 0) <= 0.769231) {
                print ""
                print "Performance regression >= 30%: " $0
                failed = 1
              }
            }

            END {
              exit failed ? 1 : 0
            }
          '

      - name: Collect executed benchmark binaries
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          for CHECKOUT in base head; do
            OUTPUT="benchmark-binaries/$CHECKOUT"
            mkdir -p "$OUTPUT"

            BENCHMARK="$(
              find "$CHECKOUT/Benchmarks/.build" \
                -type f \
                -name benchmark \
                -perm -111 \
                -print \
                -quit
            )"

            if [ -z "$BENCHMARK" ]; then
              echo "Benchmark binary not found for $CHECKOUT"
              continue
            fi

            echo "Benchmark binary for $CHECKOUT: $BENCHMARK"
            objdump -d "$BENCHMARK" > "$OUTPUT/benchmark.asm"
            nm -n "$BENCHMARK" \
              | swift demangle \
              > "$OUTPUT/benchmark.nm"
            file "$BENCHMARK" > "$OUTPUT/benchmark.file"
            sha256sum "$BENCHMARK" > "$OUTPUT/benchmark.sha256"
            cp "$BENCHMARK" "$OUTPUT/benchmark"
          done

      - name: Upload benchmark performance artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-performance-results
          path: |
            head/benchmark-results
            base/benchmark-results
            benchmark-binaries
          if-no-files-found: warn

  address-sanitizer:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest

      - name: Run tests with Address Sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0:symbolize=1:abort_on_error=1:log_path=asan-logs/asan
          SWIFT_BACKTRACE: enable=yes
        shell: bash
        run: |
          mkdir -p asan-logs
          set -o pipefail
          swift test -c debug --sanitize address --build-system native 2>&1 \
            | tee asan-logs/full-console.log

      - name: Upload Address Sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: address-sanitizer-diagnostics
          path: asan-logs
          if-no-files-found: warn
