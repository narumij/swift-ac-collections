name: Swift

on:
  push:
    branches:
      - main
      - compatible/AtCoder/2025
  pull_request:
    branches:
      - main
      - compatible/AtCoder/2025

jobs:
  debug:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest

      - name: Run tests
        run: swift test -c debug

  release:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest

      - name: Run tests
        run: swift test -c release

  address-sanitizer:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: SwiftyLab/setup-swift@latest

      - name: Run tests with Address Sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: swift test -c debug --sanitize address
