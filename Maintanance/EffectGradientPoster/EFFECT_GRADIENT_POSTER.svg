<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150" font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1800" height="1150" fill="#fbfaf7"/>

  <!-- Title -->
  <text x="60" y="78" font-size="44" font-weight="700" fill="#1e293b">判断の地図</text>
  <text x="300" y="78" font-size="26" fill="#475569">— 効果はどこまで届くか、それは誰のものか</text>
  <rect x="60" y="104" width="1680" height="58" rx="10" fill="#1e3a5f"/>
  <text x="90" y="142" font-size="22" fill="#ffffff">規則を覚えるのではなく、地図の上の自分の位置から導く。　純粋は自由、副作用だけ厳密。</text>

  <!-- ===== Left: concentric territory map ===== -->
  <text x="60" y="210" font-size="24" font-weight="700" fill="#1e293b">土地：内側ほど自由、外側ほど持ち主が遠い</text>

  <rect x="60" y="230" width="960" height="840" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="85" y="268" font-size="22" font-weight="700" fill="#334155">macOS / Xcode / Swift</text>
  <text x="85" y="296" font-size="17" fill="#475569">与えられた環境。こちらからは変えられない</text>

  <rect x="110" y="320" width="860" height="720" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="135" y="356" font-size="22" font-weight="700" fill="#5b21b6">Swift.org / Swift Package Index</text>
  <text x="135" y="384" font-size="17" fill="#5b21b6">外の世界：登録・外部への接触 ＝ あなた</text>

  <rect x="160" y="408" width="760" height="602" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="185" y="444" font-size="22" font-weight="700" fill="#92400e">GitHub</text>
  <text x="185" y="472" font-size="17" fill="#92400e">履歴・CI・公開：branch / commit / push / merge ＝ あなた</text>

  <rect x="210" y="496" width="660" height="484" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="235" y="532" font-size="22" font-weight="700" fill="#075985">Source</text>
  <text x="235" y="560" font-size="17" fill="#075985">公開面は契約（あなた）／ 内部は仕様testが守る</text>
  <text x="235" y="586" font-size="17" fill="#075985">Registry・受入 ＝ 女王（調整役Codex）</text>

  <rect x="260" y="610" width="360" height="200" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="285" y="648" font-size="22" font-weight="700" fill="#166534">Test</text>
  <text x="285" y="678" font-size="17" fill="#166534">物差し。姫の第一担当</text>
  <text x="285" y="706" font-size="17" fill="#166534">内部testの整理は自由</text>
  <text x="285" y="734" font-size="17" fill="#166534">仕様testの変更は公開契約の変更</text>
  <text x="285" y="762" font-size="17" fill="#166534">＝ あなたの持ち物</text>

  <!-- Test as Spec arrow -->
  <path d="M640 676 C 700 660, 760 660, 820 716" fill="none" stroke="#15803d" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="640" y="622" font-size="16" fill="#15803d">Test as Spec：</text>
  <text x="640" y="644" font-size="16" fill="#15803d">ソース変更の効果を内側で止める</text>

  <!-- Red-black protocol hell: deceptive path -->
  <circle cx="470" cy="880" r="10" fill="#c2410c"/>
  <path d="M480 878 C 600 880, 760 860, 940 700 L 1000 640" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arr)"/>
  <text x="240" y="860" font-size="17" font-weight="700" fill="#c2410c">難所：赤黒木のprotocol 約180本</text>
  <text x="240" y="886" font-size="15" fill="#9a3412">内側に見えて、特殊化を通じ</text>
  <text x="240" y="934" font-size="15" fill="#9a3412">性能（QR-02）＝利用者まで届く</text>
  <text x="240" y="958" font-size="15" fill="#9a3412">覚えずに、コンパイラと性能CIに聞く</text>

  <!-- Environment inbound arrow -->
  <path d="M990 300 L 930 352" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="600" y="268" font-size="15" fill="#475569">効果は外から届く（外部確認・WAITING_EXTERNAL）</text>
  <text x="600" y="290" font-size="15" fill="#475569">例：toolchainの誤コンパイル、Container要件待ち</text>

  <!-- ===== Right column ===== -->
  <!-- Three questions -->
  <text x="1070" y="210" font-size="24" font-weight="700" fill="#1e293b">判断の前に自分に聞く</text>
  <rect x="1070" y="230" width="670" height="196" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1095" y="272" font-size="21" fill="#1e293b">① この効果はどこまで届き、取り消せるか</text>
  <text x="1095" y="316" font-size="21" fill="#1e293b">② それは誰の持ち物か</text>
  <text x="1120" y="342" font-size="15" fill="#64748b">持ち主は推論しない。表に書いた事実を見る</text>
  <text x="1095" y="384" font-size="21" fill="#1e293b">③ そのニーズはまだ生きているか</text>
  <text x="1120" y="410" font-size="15" fill="#64748b">枯れたら閉じて理由を残す。前提が戻れば復活</text>

  <!-- Gradient strip -->
  <text x="1070" y="470" font-size="24" font-weight="700" fill="#1e293b">勾配：今日の許可の言葉は、この順に並んだ</text>
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#bbf7d0"/>
      <stop offset="0.5" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>
  <rect x="1070" y="490" width="670" height="34" rx="8" fill="url(#grad)"/>
  <text x="1080" y="514" font-size="15" fill="#1e293b">読む・自分だけ</text>
  <text x="1300" y="514" font-size="15" fill="#1e293b">共有の仮置き・他者の正本</text>
  <text x="1590" y="514" font-size="15" fill="#1e293b">履歴・外・最上位</text>

  <text x="1080" y="558" font-size="17" fill="#166534">「やってもいいよ」「どうぞごじゆうに」</text>
  <text x="1080" y="586" font-size="17" fill="#92400e">「採番まちにしちゃえ」　「だめ」（Registry）</text>
  <text x="1080" y="614" font-size="17" fill="#991b1b">commitは毎回明示　/　AGENTS.md・User/ は触らない</text>

  <rect x="1070" y="634" width="215" height="74" rx="10" fill="#dcfce7"/>
  <text x="1085" y="664" font-size="17" font-weight="700" fill="#166534">姫・Worker</text>
  <text x="1085" y="690" font-size="14" fill="#166534">調べる・数える・反証</text>
  <rect x="1297" y="634" width="215" height="74" rx="10" fill="#fef3c7"/>
  <text x="1312" y="664" font-size="17" font-weight="700" fill="#92400e">女王</text>
  <text x="1312" y="690" font-size="14" fill="#92400e">決める・書く・受け入れる</text>
  <rect x="1524" y="634" width="216" height="74" rx="10" fill="#fee2e2"/>
  <text x="1539" y="664" font-size="17" font-weight="700" fill="#991b1b">あなた</text>
  <text x="1539" y="690" font-size="14" fill="#991b1b">起動・介入・公開（控えめに）</text>

  <!-- Need tree -->
  <text x="1070" y="760" font-size="24" font-weight="700" fill="#1e293b">根：ニーズはここから生える</text>
  <rect x="1070" y="780" width="300" height="50" rx="10" fill="#1e3a5f"/>
  <text x="1090" y="812" font-size="18" fill="#ffffff">コンセプト定義（あなた）</text>
  <path d="M1220 830 L1220 852" stroke="#475569" stroke-width="2"/>
  <rect x="1110" y="852" width="300" height="50" rx="10" fill="#334155"/>
  <text x="1130" y="884" font-size="18" fill="#ffffff">品質要求 QR-01〜06</text>
  <path d="M1260 902 L1260 924" stroke="#475569" stroke-width="2"/>
  <rect x="1150" y="924" width="300" height="50" rx="10" fill="#64748b"/>
  <text x="1170" y="956" font-size="18" fill="#ffffff">中間ゴール</text>
  <path d="M1300 974 L1300 996" stroke="#475569" stroke-width="2"/>
  <rect x="1190" y="996" width="300" height="50" rx="10" fill="#94a3b8"/>
  <text x="1210" y="1028" font-size="18" fill="#ffffff">タスク（枯れたら消える）</text>

  <text x="1500" y="830" font-size="15" fill="#475569">品質要求は、いちばん外側の</text>
  <text x="1500" y="852" font-size="15" fill="#475569">目盛りに「何が大事か」を</text>
  <text x="1500" y="874" font-size="15" fill="#475569">書き込んだもの</text>

  <!-- Footer -->
  <text x="60" y="1112" font-size="16" fill="#64748b">2026-10-14　ユーザーと姫（Claude）の会話から。ちゃっぴーのレビュー込み。参考資料：EFFECT_GRADIENT_REFERENCE.md / MINIMAL_ORIENTATION_DRAFT.md（未採用・仮説）</text>
</svg>
