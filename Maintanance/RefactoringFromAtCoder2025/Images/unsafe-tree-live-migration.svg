<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <linearGradient id="old" x1="0" x2="1">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#b9d9fa"/>
    </linearGradient>
    <linearGradient id="new" x1="0" x2="1">
      <stop offset="0" stop-color="#d9f4ee"/>
      <stop offset="1" stop-color="#a8ded2"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" x2="1">
      <stop offset="0" stop-color="#fff4ce"/>
      <stop offset="1" stop-color="#f8d98b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#132743" flood-opacity="0.14"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1976c9"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#168778"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e56b26"/>
    </marker>
  </defs>

  <rect width="1800" height="1050" fill="#fbfaf7"/>
  <text x="90" y="70" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="42" font-weight="750" fill="#102a4f">木を動かしたまま、内部を架け替える</text>
  <text x="90" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" fill="#52657b">整数Indexからpointer Indexへ — 動く仮設から手掛かりを得て、単独交換できない4層を直す</text>

  <rect x="90" y="145" width="1620" height="92" rx="18" fill="#102f5b"/>
  <text x="125" y="183" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#ffffff">観測可能な生命線：部分的に壊れても、実行・比較・検査を切らさない</text>
  <line x1="125" y1="207" x2="1665" y2="207" stroke="#7fc4ff" stroke-width="8" marker-end="url(#arrowBlue)"/>
  <text x="1340" y="188" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#d9edff">動作 → 観測 → 修正 → 再実行</text>

  <text x="245" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#284a73">旧構造</text>
  <text x="600" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#8a5b05">並設開始</text>
  <text x="1060" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#8a5b05">責務をずらして移管</text>
  <text x="1545" y="278" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#126d63">収束</text>

  <rect x="445" y="296" width="880" height="95" rx="18" fill="#fff0e7" stroke="#e56b26" stroke-width="3" filter="url(#shadow)"/>
  <text x="885" y="329" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="750" fill="#b7470c">pointerを入れるだけでは成立しない</text>
  <text x="885" y="362" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" fill="#713c22">IndexはNodeの固定アドレスを要求する ／ CoW copyはNodeを別Storageへ動かす</text>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="35" y="423" width="130" height="82" rx="12" fill="#1769b0"/><text x="100" y="473" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Index</text>
    <rect x="35" y="527" width="130" height="82" rx="12" fill="#12897a"/><text x="100" y="577" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Node</text>
    <rect x="35" y="631" width="130" height="82" rx="12" fill="#278d51"/><text x="100" y="681" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Storage</text>
    <rect x="35" y="735" width="130" height="82" rx="12" fill="#c48708"/><text x="100" y="785" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">CoW</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" text-anchor="middle" filter="url(#shadow)">
    <rect x="190" y="423" width="285" height="82" rx="14" fill="url(#old)" stroke="#1976c9" stroke-width="2"/><text x="332" y="455" fill="#173b65">整数 rawValue</text><text x="332" y="480" fill="#173b65">Treeを保持</text>
    <rect x="525" y="423" width="310" height="82" rx="14" fill="url(#bridge)" stroke="#d79a17" stroke-width="2"/><text x="680" y="455" fill="#704b05">pointer + node_id</text><text x="680" y="480" fill="#704b05">先に切替</text>
    <rect x="905" y="423" width="300" height="82" rx="14" fill="url(#bridge)" stroke="#d79a17" stroke-width="2"/><text x="1055" y="455" fill="#704b05">V2 → sealed / tied</text><text x="1055" y="480" fill="#704b05">寿命の安全柵を後付け</text>
    <rect x="1390" y="423" width="320" height="82" rx="14" fill="url(#new)" stroke="#168778" stroke-width="2"/><text x="1550" y="455" fill="#125e55">UnsafeIndexV3</text><text x="1550" y="480" fill="#125e55">_LazyTiedPtr</text>

    <rect x="190" y="527" width="285" height="82" rx="14" fill="url(#old)" stroke="#1976c9" stroke-width="2"/><text x="332" y="559" fill="#173b65">連続領域内Node</text><text x="332" y="584" fill="#173b65">整数リンク</text>
    <rect x="525" y="527" width="310" height="82" rx="14" fill="url(#bridge)" stroke="#d79a17" stroke-width="2"/><text x="680" y="559" fill="#704b05">UnsafeNode</text><text x="680" y="584" fill="#704b05">pointerリンク</text>
    <rect x="1040" y="527" width="300" height="82" rx="14" fill="url(#bridge)" stroke="#d79a17" stroke-width="2"/><text x="1190" y="559" fill="#704b05">tracking tag</text><text x="1190" y="584" fill="#704b05">+ recycle count</text>
    <rect x="1390" y="527" width="320" height="82" rx="14" fill="url(#new)" stroke="#168778" stroke-width="2"/><text x="1550" y="559" fill="#125e55">Node + payload</text><text x="1550" y="584" fill="#125e55">raw領域</text>

    <rect x="190" y="631" width="285" height="82" rx="14" fill="url(#old)" stroke="#1976c9" stroke-width="2"/><text x="332" y="663" fill="#173b65">ManagedBuffer</text><text x="332" y="688" fill="#173b65">&lt;Header, Node&gt;</text>
    <rect x="675" y="631" width="300" height="82" rx="14" fill="url(#bridge)" stroke="#d79a17" stroke-width="2"/><text x="825" y="663" fill="#704b05">ManagedBufferPointer</text><text x="825" y="688" fill="#704b05">旧Headerを再利用</text>
    <rect x="1040" y="631" width="300" height="82" rx="14" fill="url(#bridge)" stroke="#d79a17" stroke-width="2"/><text x="1190" y="663" fill="#704b05">専用Buffer + bucket</text><text x="1190" y="688" fill="#704b05">element → Origin → Void</text>
    <rect x="1390" y="631" width="320" height="82" rx="14" fill="url(#new)" stroke="#168778" stroke-width="2"/><text x="1550" y="663" fill="#125e55">Header + raw bucket</text><text x="1550" y="688" fill="#125e55">ManagedBufferPointer&lt;…, Void&gt;</text>

    <rect x="190" y="735" width="285" height="82" rx="14" fill="url(#old)" stroke="#1976c9" stroke-width="2"/><text x="332" y="767" fill="#173b65">共有・容量不足で</text><text x="332" y="792" fill="#173b65">全体copy</text>
    <rect x="525" y="735" width="310" height="82" rx="14" fill="url(#bridge)" stroke="#d79a17" stroke-width="2"/><text x="680" y="767" fill="#704b05">一意ならpool成長</text><text x="680" y="792" fill="#704b05">共有時はnode_idで再構築</text>
    <rect x="905" y="735" width="300" height="82" rx="14" fill="#f2f3f5" stroke="#8794a3" stroke-width="2" stroke-dasharray="7 6"/><text x="1055" y="767" fill="#56616d">refCount / strong uniqueness</text><text x="1055" y="792" fill="#7b858f">試行して撤去</text>
    <rect x="1390" y="735" width="320" height="82" rx="14" fill="url(#new)" stroke="#168778" stroke-width="2"/><text x="1550" y="767" fill="#125e55">一意ならin-place成長</text><text x="1550" y="792" fill="#125e55">共有時だけ再構築</text>
  </g>

  <g fill="none" stroke-linecap="round">
    <path d="M475 464 H525" stroke="#e56b26" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M835 464 H905" stroke="#e56b26" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M1205 464 H1390" stroke="#168778" stroke-width="4" marker-end="url(#arrowTeal)"/>
    <path d="M475 568 H525" stroke="#e56b26" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M835 568 H1040" stroke="#e56b26" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M1340 568 H1390" stroke="#168778" stroke-width="4" marker-end="url(#arrowTeal)"/>
    <path d="M475 672 H675" stroke="#e56b26" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M975 672 H1040" stroke="#e56b26" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M1340 672 H1390" stroke="#168778" stroke-width="4" marker-end="url(#arrowTeal)"/>
    <path d="M475 776 H525" stroke="#e56b26" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M835 776 H905" stroke="#e56b26" stroke-width="4" marker-end="url(#arrowOrange)"/>
    <path d="M1205 776 H1390" stroke="#168778" stroke-width="4" marker-end="url(#arrowTeal)"/>
    <path d="M680 505 V527" stroke="#e56b26" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
    <path d="M1190 609 V631" stroke="#e56b26" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
    <path d="M1190 713 C1190 725 1120 725 1120 735" stroke="#e56b26" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrowOrange)"/>
  </g>

  <rect x="90" y="854" width="1620" height="140" rx="18" fill="#f7f8fa" stroke="#c5ced8" stroke-width="2"/>
  <text x="120" y="891" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="700" fill="#26384d">検証網も固定しない</text>
  <line x1="315" y1="886" x2="1660" y2="886" stroke="#1976c9" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="540" y="878" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#284a73">公開挙動のテストを足場として継続</text>
  <path d="M315 940 H610 M610 940 H1120 M1120 940 H1660" fill="none" stroke="#d27624" stroke-width="5" stroke-dasharray="12 8" marker-end="url(#arrowOrange)"/>
  <text x="455" y="966" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#8a520c">旧Fixture</text>
  <text x="865" y="966" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#8a520c">Keystoneを分岐保存・一部 #if false</text>
  <text x="1390" y="966" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#8a520c">新しい内部境界へ検証を再接続</text>
  <text x="900" y="1025" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="700" fill="#b7470c">動作は完成の証明ではない：次の改善を可能にする観測基盤だった</text>
</svg>
