<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" font-family="-apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <!-- OPS-157/OPS-158 the isolated decision-record prototype (Maintanance/Current/Evidence/OPS-158/durable, 2026-10-19).
       Edit this SVG; the PNG is rendered from it. Green solid = tables actually stored in the SQLite file; blue dashed = derived
       by folding the events in memory (not tables); gray = operations and reads; purple frame = the isolated prototype.
       Sources: durable/decision_store.py, decision_cli.py, README.md, DECISION_DB_STUDY.md. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c5b5e"/></marker>
    <style>
      .t{font-size:30px;font-weight:700;fill:#1f2d2f}
      .h{font-size:21px;font-weight:700;fill:#1f2d2f}
      .b{font-size:17px;fill:#243234}
      .s{font-size:15px;fill:#4c5b5e}
      .m{font-size:16px;fill:#243234;font-family:Menlo, monospace}
      .tbl{fill:#e7f4ec;stroke:#2f7d55;stroke-width:2.5}
      .der{fill:#eef4fb;stroke:#3a6ea5;stroke-width:2.2;stroke-dasharray:8 5}
      .op{fill:#f6f7f7;stroke:#6f7c79;stroke-width:2}
      .md{fill:#fffaf0;stroke:#a07a2c;stroke-width:2.2}
      .iso{fill:none;stroke:#6b4fa3;stroke-width:3;stroke-dasharray:3 5}
      .ln{stroke:#4c5b5e;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .lab{font-size:14px;fill:#4c5b5e}
    </style>
  </defs>
  <rect width="1900" height="1080" fill="#ffffff"/>
  <text x="40" y="54" class="t">判断の記録の試作（OPS-158、隔離）</text>
  <text x="40" y="86" class="s">判断の正本は Markdown のまま。サーバーにつながっていない・未配備。記録は承認ではなく、参照は全部ではない。</text>
  <rect x="1180" y="30" width="34" height="22" rx="4" class="tbl"/><text x="1224" y="47" class="s">ファイルに保存する表</text>
  <rect x="1420" y="30" width="34" height="22" rx="4" class="der"/><text x="1464" y="47" class="s">畳み込みで作る（表ではない）</text>
  <rect x="1720" y="30" width="34" height="22" rx="4" class="op"/><text x="1764" y="47" class="s">操作・読取</text>

  <rect x="20" y="104" width="1600" height="956" rx="16" class="iso"/>
  <text x="40" y="134" class="s">Maintanance/Current/Evidence/OPS-158/durable/（隔離した試作。本番の置き場は未決）</text>

  <!-- writes -->
  <rect x="40" y="150" width="420" height="300" rx="10" class="op"/>
  <text x="56" y="182" class="h">書く操作（decision_cli.py apply）</text>
  <text x="56" y="212" class="m">register</text><text x="196" y="212" class="s">新しいID、改訂1は案</text>
  <text x="56" y="240" class="m">propose</text><text x="196" y="240" class="s">改訂n+1の案（基準は最新）</text>
  <text x="56" y="268" class="m">record_adoption</text>
  <text x="76" y="292" class="s">外で決まった採用を記録。決定者・出典は必須、</text>
  <text x="76" y="314" class="s">replaces＝今の採用（なければnull）</text>
  <text x="56" y="342" class="m">record_withdrawal</text>
  <text x="76" y="366" class="s">外で決まった撤回を記録。撤回した改訂は再採用不可</text>
  <text x="56" y="394" class="m">add_reference</text><text x="216" y="394" class="s">copy・出典・却下案など</text>
  <text x="76" y="418" class="s">supersedes：確かめたcopyで古いcopyを置き換え</text>
  <text x="56" y="442" class="s">訂正の操作はない（誤記も新しい改訂）</text>

  <rect x="40" y="470" width="420" height="266" rx="10" class="op"/>
  <text x="56" y="502" class="h">適用の手順 apply(op_id, 要求)</text>
  <text x="56" y="532" class="b">1. BEGIN IMMEDIATE（書き手を1つずつ）</text>
  <text x="56" y="560" class="b">2. 同じop_idがある：同じ要求なら再送</text>
  <text x="76" y="584" class="s">（記録した結果や拒否をそのまま返す）</text>
  <text x="76" y="606" class="s">違う要求なら食い違い。何も書かない</text>
  <text x="56" y="634" class="b">3. eventsを畳み込んで今の状態を作る</text>
  <text x="56" y="662" class="b">4. 基準・ID・参照の整合を確かめる</text>
  <text x="56" y="690" class="b">5. eventを1行足す（成功も拒否も）</text>
  <text x="56" y="718" class="s">古い基準は拒否。後から来たほうで上書きしない</text>

  <rect x="40" y="756" width="420" height="284" rx="10" class="md"/>
  <text x="56" y="788" class="h">正本（Markdown・決定の記録）</text>
  <text x="56" y="818" class="b">判断の本文と理由は、ここにある</text>
  <text x="56" y="846" class="b">storeは本文の写しと出典を記録する</text>
  <text x="56" y="872" class="b">（試行の引用は行のsha256も持つ）</text>
  <text x="56" y="904" class="s">意味の確かめは人が行う</text>
  <text x="56" y="930" class="s">コードは出典の中身を承認しない</text>
  <text x="56" y="962" class="s">試しの3件（D1〜D3）は、受入済みの</text>
  <text x="56" y="986" class="s">result.json から導く（fixtures.py）</text>
  <text x="56" y="1018" class="s">D1 版の順・D2 文書が先・D3 復元後は閉じる</text>

  <!-- stored tables -->
  <text x="520" y="182" class="h">SQLiteのファイルに保存するもの（これだけ）</text>
  <rect x="520" y="198" width="500" height="120" rx="10" class="tbl"/>
  <text x="536" y="230" class="h">meta</text>
  <text x="536" y="260" class="m">one = 1, schema_version, created_at</text>
  <text x="536" y="292" class="s">init が新しいファイルにだけ作る（既存のpathは拒否）</text>
  <rect x="520" y="334" width="500" height="290" rx="10" class="tbl"/>
  <text x="536" y="366" class="h">events（追記だけ）</text>
  <text x="536" y="396" class="m">seq          連番</text>
  <text x="536" y="422" class="m">op_id        UNIQUE</text>
  <text x="536" y="448" class="m">digest       要求のhash</text>
  <text x="536" y="474" class="m">kind, status done | refused</text>
  <text x="536" y="500" class="m">request, result （JSON）</text>
  <text x="536" y="526" class="m">actor, recorded_at</text>
  <text x="536" y="562" class="s">UPDATE と DELETE は trigger が止める</text>
  <text x="536" y="586" class="s">古い改訂は、書き換えられないので必ず残る</text>
  <text x="536" y="610" class="s">拒否も記録するので、再送しても同じ答え</text>

  <!-- derived -->
  <text x="1080" y="182" class="h">畳み込みで作るもの（メモリ上。表ではない）</text>
  <rect x="1080" y="198" width="520" height="140" rx="10" class="der"/>
  <text x="1096" y="230" class="h">判断 decisions</text>
  <text x="1096" y="260" class="m">id, scope, adopted, withdrawn</text>
  <text x="1096" y="290" class="s">1つのIDに1つの範囲。範囲が違えば別のID</text>
  <text x="1096" y="316" class="s">「今の採用」は最新の時刻ではなく、記録した採用</text>
  <rect x="1080" y="354" width="520" height="140" rx="10" class="der"/>
  <text x="1096" y="386" class="h">改訂 revisions</text>
  <text x="1096" y="416" class="m">n, statement, source, proposedBy</text>
  <text x="1096" y="442" class="m">adoption, withdrawal</text>
  <text x="1096" y="472" class="s">案と採用は別の操作。案だけでは何も変わらない</text>
  <rect x="1080" y="510" width="520" height="114" rx="10" class="der"/>
  <text x="1096" y="542" class="h">参照 references</text>
  <text x="1096" y="572" class="m">decision, revision, kind, locator,</text>
  <text x="1096" y="598" class="m">supersededBy</text><text x="1260" y="598" class="s">locator は正本の行を指す</text>

  <!-- reads -->
  <rect x="520" y="660" width="1080" height="200" rx="10" class="op"/>
  <text x="536" y="692" class="h">読むこと（読取専用 mode=ro、出力に権限の注記）</text>
  <text x="536" y="724" class="m">query --id</text><text x="680" y="724" class="b">1つの判断の、すべての改訂と参照（古い改訂も）</text>
  <text x="536" y="756" class="m">query --review</text><text x="720" y="756" class="b">確かめ直す候補のcopyだけ：</text>
  <text x="556" y="782" class="s">今の採用より古い改訂を指し、まだ置き換えられていないcopy。撤回のあとは、撤回した改訂とそれより古いもの。</text>
  <text x="556" y="806" class="s">採用が一度もなければ空。新しい案を指すcopyは入れない。並べるだけで、何も書き換えない。</text>
  <text x="536" y="840" class="m">export</text><text x="640" y="840" class="b">すべてのevent（成功と拒否）を順に。見直し用で、backupの手順ではない</text>

  <rect x="520" y="880" width="1080" height="160" rx="10" class="op"/>
  <text x="536" y="912" class="h">保全</text>
  <text x="536" y="944" class="m">backup --to NEW</text><text x="720" y="944" class="b">SQLiteのbackupを、新しく作ったファイルへ。既存のpathは拒否して残す</text>
  <text x="536" y="976" class="m">validate</text><text x="640" y="976" class="b">integrity・schema・畳み込みを読取専用で確かめる</text>
  <text x="536" y="1012" class="s">復元して書き込む入口はない。backupは query で読むだけ。失ったあとの書込の再開は、止めて相談する。</text>

  <!-- side notes -->
  <rect x="1640" y="104" width="240" height="956" rx="14" fill="#fbfbfb" stroke="#c9d3d0" stroke-width="2"/>
  <text x="1656" y="140" class="h">しないこと</text>
  <text x="1656" y="172" class="b">サーバーへ接続</text>
  <text x="1656" y="200" class="b">画面（UI）</text>
  <text x="1656" y="228" class="b">本番の配置</text>
  <text x="1656" y="256" class="b">自動の登録・判断</text>
  <text x="1656" y="284" class="b">全量の移行</text>
  <text x="1656" y="312" class="b">出典の自動監視</text>
  <text x="1656" y="340" class="b">訂正の操作</text>
  <text x="1656" y="368" class="b">範囲どうしの関係</text>
  <text x="1656" y="410" class="h">確かめたこと</text>
  <text x="1656" y="442" class="s">試験17件（一時dirのみ）</text>
  <text x="1656" y="466" class="s">再送・食い違い・基準の</text>
  <text x="1656" y="488" class="s">競合・案と採用の分離・</text>
  <text x="1656" y="510" class="s">旧改訂の保持・参照の</text>
  <text x="1656" y="532" class="s">整合・置き換え・撤回・</text>
  <text x="1656" y="554" class="s">読取専用・backup</text>
  <text x="1656" y="596" class="h">注意</text>
  <text x="1656" y="628" class="s">登録されていないcopyは、</text>
  <text x="1656" y="650" class="s">copyがない証拠ではない</text>
  <text x="1656" y="682" class="s">参照があっても、判断が</text>
  <text x="1656" y="704" class="s">今も正しいとは言えない</text>
  <text x="1656" y="736" class="s">問い合わせは毎回すべての</text>
  <text x="1656" y="758" class="s">eventを畳み込む（数件用）</text>

  <!-- arrows -->
  <path d="M460 300 L520 420" class="ln"/><text x="468" y="350" class="lab">追記</text>
  <path d="M1020 440 L1080 268" class="ln"/><text x="1026" y="330" class="lab">畳み込み</text>
  <path d="M1020 480 L1080 424" class="ln"/>
  <path d="M1020 520 L1080 566" class="ln"/>
  <path d="M1340 624 L1340 660" class="ln"/>
</svg>
