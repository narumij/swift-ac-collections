<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" font-family="-apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif">
  <!-- OPS-157 Registry Studio architecture after the Registry V3 cutover (2026-10-19, OPS-167 DONE). Edit this SVG; the PNG is
       rendered from it. Colors: green = implemented and accepted, dashed gray = planned or pending, purple = isolated prototype
       (not connected to the server, not deployed). Sources: REGISTRY_V3_OPERATIONS.md, v3/README.md, serve.py, sync.py,
       STUDIO_COMMUNICATION_STORE.md, DECISION_DB_STUDY.md. -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4c5b5e"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa6a2"/></marker>
    <style>
      .t{font-size:30px;font-weight:700;fill:#1f2d2f}
      .h{font-size:21px;font-weight:700;fill:#1f2d2f}
      .b{font-size:17px;fill:#243234}
      .s{font-size:15px;fill:#4c5b5e}
      .done{fill:#e7f4ec;stroke:#2f7d55;stroke-width:2.5}
      .plan{fill:#f6f7f7;stroke:#9aa6a2;stroke-width:2;stroke-dasharray:9 6}
      .iso{fill:#f1ecfa;stroke:#6b4fa3;stroke-width:2.5;stroke-dasharray:3 4}
      .zone{fill:none;stroke:#c9d3d0;stroke-width:2}
      .ln{stroke:#4c5b5e;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .lnd{stroke:#9aa6a2;stroke-width:2.2;fill:none;stroke-dasharray:8 6;marker-end:url(#ad)}
      .lab{font-size:14px;fill:#4c5b5e}
    </style>
  </defs>
  <rect width="1900" height="1080" fill="#ffffff"/>
  <text x="40" y="54" class="t">Registry Studio の構成（2026-10-19、Registry V3 切替後）</text>
  <text x="40" y="86" class="s">taskと構造の正本は Registry V3 DB。判断・仕様・成果の正本は Markdown のまま。名前は本人申告で、認証ではない。</text>
  <rect x="1250" y="30" width="34" height="22" rx="4" class="done"/><text x="1294" y="47" class="s">実装・受入済み</text>
  <rect x="1440" y="30" width="34" height="22" rx="4" class="plan"/><text x="1484" y="47" class="s">予定・保留</text>
  <rect x="1610" y="30" width="34" height="22" rx="4" class="iso"/><text x="1654" y="47" class="s">隔離した試作</text>

  <!-- C1: user and screen -->
  <rect x="30" y="112" width="440" height="940" rx="14" class="zone"/>
  <rect x="50" y="128" width="400" height="76" rx="10" class="done"/>
  <text x="66" y="160" class="h">ユーザー（ブラウザ）</text>
  <text x="66" y="188" class="b">見る・承認する・編集版を保存・再起動</text>
  <text x="50" y="236" class="h">画面（生成したページ）</text>
  <rect x="50" y="252" width="400" height="160" rx="10" class="done"/>
  <text x="66" y="284" class="h">作業ページ</text>
  <text x="66" y="312" class="b">作業カード・メンバー欄・待機完了</text>
  <text x="66" y="338" class="b">連絡の一覧・本文・改訂の履歴</text>
  <text x="66" y="364" class="s">共通snapshot → deriveStudio（純粋）→ View</text>
  <text x="66" y="390" class="s">閲覧は何も記録しない</text>
  <rect x="50" y="426" width="400" height="188" rx="10" class="done"/>
  <text x="66" y="458" class="h">タスクページ（V3）</text>
  <text x="66" y="486" class="b">DBのexportを表示・編集・保存・再開</text>
  <text x="66" y="512" class="b">新しい版（位置を選ぶ）・新しいカード・</text>
  <text x="66" y="538" class="b">条件の提案・計画の並べ替え</text>
  <text x="66" y="566" class="s">保存はInboxだけ。DBへは書かない</text>
  <text x="66" y="592" class="s">種類の違う編集版は開かない・再開しない</text>
  <rect x="50" y="628" width="400" height="128" rx="10" class="plan"/>
  <text x="66" y="660" class="h">これからの画面</text>
  <text x="66" y="688" class="b">メンバー欄のPING（旧経路の切替は保留）</text>
  <text x="66" y="714" class="b">一般の活動の履歴の閲覧</text>
  <text x="66" y="740" class="s">判断の記録の画面は作らない（試作は隔離）</text>
  <rect x="50" y="770" width="400" height="262" rx="10" class="done"/>
  <text x="66" y="802" class="h">起動（ユーザーの操作）</text>
  <text x="66" y="832" class="b">serve.py --v3-db Data/registry.sqlite3</text>
  <text x="66" y="858" class="b">          --v3-saves Inbox</text>
  <text x="66" y="890" class="s">切替後は引数なしの旧モードを使わない</text>
  <text x="66" y="916" class="s">（旧モードの起動の拒否は後回し）</text>
  <text x="66" y="948" class="s">起動時と「更新」で sync.py --v3-db が</text>
  <text x="66" y="972" class="s">ページ・文書の束・採番待ちを作る</text>
  <text x="66" y="1004" class="s">構造はDBから。フォルダの並びは読まない</text>

  <!-- C2: server -->
  <rect x="510" y="112" width="370" height="940" rx="14" class="zone"/>
  <text x="530" y="146" class="h">サーバー serve.py（127.0.0.1）</text>
  <rect x="530" y="162" width="330" height="214" rx="10" class="done"/>
  <text x="546" y="194" class="h">V3 の読取（--v3-db）</text>
  <text x="546" y="222" class="b">GET / ：ページのseedだけを</text>
  <text x="546" y="248" class="b">DBのexportへ差し替える</text>
  <text x="546" y="274" class="b">GET /registry.json ：同じexport</text>
  <text x="546" y="300" class="b">要求ごとに読取専用で開く（mode=ro）</text>
  <text x="546" y="328" class="s">1回のexportは1つの読取snapshot</text>
  <text x="546" y="354" class="s">適用の入口はない（書くのはCLI）</text>
  <rect x="530" y="392" width="330" height="138" rx="10" class="done"/>
  <text x="546" y="424" class="h">編集版の保存と再開</text>
  <text x="546" y="452" class="b">POST /save ：V3の編集版だけ</text>
  <text x="546" y="478" class="b">GET /workspace ：V3だけを再開</text>
  <text x="546" y="506" class="s">旧保存は残す。照合が不明なら知らせる</text>
  <rect x="530" y="546" width="330" height="188" rx="10" class="done"/>
  <text x="546" y="578" class="h">承認・連絡の API</text>
  <text x="546" y="606" class="b">承認（全部か無しか）</text>
  <text x="546" y="632" class="b">連絡：送信・受領・着手・返答・</text>
  <text x="546" y="658" class="b">辞退・停止・閉じる・改訂</text>
  <text x="546" y="686" class="b">操作ID（同じ内容は再送）</text>
  <text x="546" y="712" class="s">新しい依頼は連絡DBで受ける</text>
  <rect x="530" y="750" width="330" height="128" rx="10" class="done"/>
  <text x="546" y="782" class="h">待機完了・活動の読み取り</text>
  <text x="546" y="810" class="b">WAKE を events.jsonl へ書く</text>
  <text x="546" y="836" class="b">活動・continuity を読む</text>
  <text x="546" y="862" class="s">活動の全部を移したわけではない</text>
  <rect x="530" y="894" width="330" height="138" rx="10" class="done"/>
  <text x="546" y="926" class="h">POST /sync</text>
  <text x="546" y="954" class="b">sync.py --v3-db を走らせる</text>
  <text x="546" y="980" class="b">（文書の束・採番待ち）</text>
  <text x="546" y="1008" class="s">DBへ書かない・Markdownを取り込まない</text>

  <!-- C3: stores -->
  <rect x="920" y="112" width="490" height="940" rx="14" class="zone"/>
  <text x="940" y="146" class="h">保存先</text>
  <rect x="940" y="162" width="450" height="150" rx="10" class="done"/>
  <text x="956" y="194" class="h">Registry V3 DB（SQLite、正本）</text>
  <text x="956" y="222" class="b">Data/registry.sqlite3（Git対象外）</text>
  <text x="956" y="248" class="b">task・グラフ・版・カード・focus・採番</text>
  <text x="956" y="274" class="s">開くのは：サーバー（読取専用）・CLI（書込）・</text>
  <text x="956" y="296" class="s">viewの生成とbackupの手順</text>
  <rect x="940" y="328" width="450" height="110" rx="10" class="done"/>
  <text x="956" y="360" class="h">backup（リポジトリの外）</text>
  <text x="956" y="388" class="b">~/Documents/RegistryStudioBackups/…</text>
  <text x="956" y="414" class="s">上書きしない。復元は新しい世代で、書込は閉じたまま</text>
  <rect x="940" y="454" width="450" height="136" rx="10" class="done"/>
  <text x="956" y="486" class="h">承認・連絡 DB（SQLite）</text>
  <text x="956" y="514" class="b">Approvals/approvals.sqlite3</text>
  <text x="956" y="540" class="b">承認・操作の記録・連絡（letters）</text>
  <text x="956" y="566" class="s">開くのはサーバーだけ（CLIはAPI経由）</text>
  <rect x="940" y="606" width="450" height="104" rx="10" class="done"/>
  <text x="956" y="638" class="h">活動の記録 events.jsonl</text>
  <text x="956" y="666" class="b">依頼・着手・返却などの活動、WAKE、PING</text>
  <text x="956" y="692" class="s">連絡は連絡DBへ移った。全部の移行ではない</text>
  <rect x="940" y="726" width="450" height="92" rx="10" class="done"/>
  <text x="956" y="758" class="h">Inbox（編集版）</text>
  <text x="956" y="786" class="b">V3の編集版と旧形式の編集版が並ぶ</text>
  <text x="956" y="808" class="s">旧保存は消さず、変換せず、1件ずつ照合する</text>
  <rect x="940" y="834" width="450" height="198" rx="10" class="done"/>
  <text x="956" y="866" class="h">Markdown（正本と生成view）</text>
  <text x="956" y="894" class="b">判断・仕様・成果・制度：正本のまま</text>
  <text x="956" y="920" class="b">Registry・Rules の表、STRUCTURE.generated.md：</text>
  <text x="956" y="946" class="b">DBから作る読取用の view（手で書き換えない）</text>
  <text x="956" y="974" class="s">HEAD.md・カードの箱・フォルダの並びは</text>
  <text x="956" y="998" class="s">DBから作り直さない（読み手は古くなりうる）</text>
  <text x="956" y="1022" class="s">Cache：生成したページと registry.json</text>

  <!-- C4: writers -->
  <rect x="1440" y="112" width="430" height="940" rx="14" class="zone"/>
  <text x="1460" y="146" class="h">書き手（調整担当・CLI・エージェント）</text>
  <rect x="1460" y="162" width="370" height="262" rx="10" class="done"/>
  <text x="1476" y="194" class="h">正式反映の一巡（調整担当）</text>
  <text x="1476" y="222" class="b">1. 反映前の backup と確かめ</text>
  <text x="1476" y="248" class="b">2. registry_v3_cli.py apply-groups</text>
  <text x="1476" y="274" class="b">    （保存・選択・基準を明示）</text>
  <text x="1476" y="300" class="b">3. view を作り直す（replace_in_place）</text>
  <text x="1476" y="326" class="b">4. 必要なら sync.py --v3-db</text>
  <text x="1476" y="352" class="b">5. 反映後の backup → commit</text>
  <text x="1476" y="382" class="s">書き手は1人。同じ操作IDで再送できる</text>
  <text x="1476" y="406" class="s">focus・DONE も CLI の操作で書く</text>
  <rect x="1460" y="440" width="370" height="128" rx="10" class="done"/>
  <text x="1476" y="472" class="h">連絡の道具 comm.py</text>
  <text x="1476" y="500" class="b">サーバーのAPIを通る（DBを直接開かない）</text>
  <text x="1476" y="526" class="b">待機は連絡DBのwatchとjsonlの両方</text>
  <text x="1476" y="552" class="s">PINGの旧経路の切替は保留</text>
  <rect x="1460" y="584" width="370" height="128" rx="10" class="done"/>
  <text x="1476" y="616" class="h">エージェント（Astra・姫など）</text>
  <text x="1476" y="644" class="b">正本のMarkdownと生成viewを読む</text>
  <text x="1476" y="670" class="b">DB管理の表を手で書き換えない</text>
  <text x="1476" y="696" class="s">表とDBが違えばDBを確かめる</text>
  <rect x="1460" y="728" width="370" height="150" rx="10" class="iso"/>
  <text x="1476" y="760" class="h">判断の記録の試作（OPS-158）</text>
  <text x="1476" y="788" class="b">専用の decision_cli.py だけで開く</text>
  <text x="1476" y="814" class="b">サーバーにつながっていない・未配備</text>
  <text x="1476" y="840" class="s">記録は承認ではない。正本はMarkdown</text>
  <text x="1476" y="864" class="s">詳しくは decision-db.png</text>

  <!-- arrows: only in the gutters between columns -->
  <path d="M400 204 L400 252" class="ln"/>
  <path d="M450 330 L530 330" class="ln"/><text x="462" y="320" class="lab">HTTP</text>
  <path d="M450 520 L530 470" class="ln"/>
  <path d="M860 236 L940 236" class="ln"/><text x="866" y="226" class="lab">読取専用</text>
  <path d="M860 470 L940 770" class="ln"/>
  <path d="M860 600 L940 522" class="ln"/>
  <path d="M860 810 L940 660" class="ln"/>
  <path d="M860 960 L940 1010" class="ln"/><text x="872" y="952" class="lab">Cache</text>
  <path d="M1460 236 L1390 236" class="ln"/><text x="1404" y="226" class="lab">書込</text>
  <path d="M1460 222 L1390 382" class="ln"/>
  <path d="M1460 410 L1390 870" class="ln"/><text x="1418" y="560" class="lab">view</text>
  <path d="M1390 990 L1460 700" class="ln"/><text x="1424" y="930" class="lab">読む</text>
</svg>
