<section id="documentArea" class="document-area" role="tabpanel" aria-labelledby="documentAreaTab" hidden>
    <label for="canonical-document-select">タスク</label>
    <select id="canonical-document-select"><option value="">タスク番号を選んでください</option></select>
    <section class="canonical-reader" aria-label="タスクの正本">
        <h2 id="canonical-document-title">タスクの正本</h2>
        <p id="canonical-document-stamp" class="muted" role="status"></p>
        <article id="canonical-document-body"><p>タスク番号を選ぶと、指定された正本の各部分を順に表示します。</p></article>
        <details id="canonical-task-letters"><summary>関連連絡</summary><div id="canonical-task-letter-list"></div></details>
    </section>
</section>
