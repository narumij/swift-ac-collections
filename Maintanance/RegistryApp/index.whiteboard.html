<section id="whiteboardArea" role="tabpanel" aria-labelledby="whiteboardAreaTab" hidden>
  <div class="whiteboard-tools"><button id="board-pen" type="button" aria-pressed="true">黒線</button>
  <button id="board-text" type="button" aria-pressed="false">テキスト</button>
  <input id="board-text-input" aria-label="配置するテキスト" placeholder="文字を入力して板をクリック" maxlength="2000">
  <span id="board-status" role="status">接続中…</span></div>
  <p class="muted">共有の試作ボード · サーバー再起動で消えます</p>
  <svg id="whiteboard-canvas" viewBox="0 0 1200 700" role="img" aria-label="共有ホワイトボード"></svg>
</section>
